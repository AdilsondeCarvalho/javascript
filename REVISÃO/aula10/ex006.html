<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area {
            font: normal 20pt Arial;
            background: rgb(73, 236, 73);
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Disparar 3 eventos-->
    <div id="area">
        Interaja...
    </div>

    <script>
        //Problema de uso de memória
        //Objeto do lado de fora, escopo glogal - serve para todas as function
        var a = window.document.getElementById('area')

        //Prestar atenção a um evento - criar 3 listener
        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)
        
        function clicar() {
            a.innerText = 'Clicou' // 1° Evento
            a.style.background = 'red'
        }
        function entrar() {
            a.innerText = 'Entrou' // 1° Evento
            a.style.background = 'gray'
        }
        function sair() {
            a.innerText = 'Saiu' // 1° Evento
            a.style.background = 'green'
        }
    </script>
    
</body>
</html>
